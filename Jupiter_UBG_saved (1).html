<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jupiter UBG</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif}
body{background:#1d5dac;color:white;padding:24px 16px 40px}
header{text-align:center;margin:4px 0 26px}h1{margin:0;font-size:36px}header p{margin:8px 0;font-size:16px}
.games{max-width:1000px;margin:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.slot{display:block;min-width:0;width:100%;padding:0;border:2px solid #103870;border-radius:5px;background:#164987;color:white;text-align:center;text-decoration:none;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;overflow:hidden}
.preview{height:110px;display:flex;justify-content:center;align-items:center;background:#2873c4;font-size:50px}.game-icon{font-size:50px}
.card-body{display:flex;align-items:center;justify-content:center;padding:18px 8px;min-height:110px}.name{display:block;font-size:14px;line-height:1.4;font-weight:bold}
.playable{cursor:pointer}.playable:hover{border-color:white;background:#1c559a}.slot:disabled{opacity:1;color:#d7e6fb}
.slot:focus-visible,.toolbar button:focus-visible,.toolbar a:focus-visible{outline:3px solid #ffe26b;outline-offset:3px}
.game-window{display:none;position:fixed;inset:0;z-index:9999;padding:16px;background:#000a;align-items:center;justify-content:center}.game-window:target{display:flex}
.window-content{width:min(1000px,100%);height:86vh;height:86dvh;display:flex;flex-direction:column;background:#050816;border:2px solid #333;border-radius:4px;overflow:hidden}
.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px;background:#dedede;color:#111;border-bottom:2px solid #333}.toolbar h2{font-size:16px;margin:0 auto 0 0}
.toolbar button,.toolbar a{font:13px "Cambria Math","STIX Two Math","Times New Roman",serif;padding:8px 10px;min-height:34px;border:1px solid #777;border-radius:3px;background:#f5f5f5;color:#111;text-decoration:none;cursor:pointer;white-space:nowrap}.toolbar button:hover,.toolbar a:hover{background:white}.toolbar .close-game{background:#f5cccc}
.game-frame{display:block;border:0;width:100%;flex:1;min-height:0;background:#050816}
#windowStatus,#clusterStatus,#retroStatus{margin:0;padding:8px 12px;background:#fff1bd;color:#342b13;font-size:13px;line-height:1.4}#windowStatus:empty,#clusterStatus:empty,#retroStatus:empty{display:none}
.game-window.expanded{padding:0}.game-window.expanded .window-content{width:100%;height:100%;border:0;border-radius:0}
.game-window:fullscreen{padding:0;display:flex}.game-window:fullscreen .window-content{width:100%;height:100%;border:0;border-radius:0}
.game-window:-webkit-full-screen{padding:0;display:flex}.game-window:-webkit-full-screen .window-content{width:100%;height:100%;border:0;border-radius:0}
@media(max-width:800px){.games{grid-template-columns:repeat(3,minmax(0,1fr))}.toolbar h2{width:100%;margin-bottom:4px}}
@media(max-width:500px){.games{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.preview{height:100px}h1{font-size:30px}.game-window{padding:6px}.window-content{height:94vh;height:94dvh}.toolbar button,.toolbar a{flex:1 1 calc(50% - 6px);text-align:center}}
.slot{position:relative;aspect-ratio:1;transition:transform .16s ease;transform-origin:center}
.slot:hover{transform:scale(1.045);z-index:2}
.card-body{height:100%;min-height:0}
#retroSlot{background-color:#2873c4;background-size:cover;background-position:center;background-repeat:no-repeat}
#retroSlot .card-body{position:absolute;bottom:0;left:0;right:0;height:auto;min-height:0;padding:14px 8px}
#retroSlot .name{font-size:22px;color:#fff;-webkit-text-stroke:1px #000;paint-order:stroke fill;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
@media(prefers-reduced-motion:reduce){.slot{transition:none}.slot:hover{transform:none}}

var MAX_PARTS = 128;

async function headOk(url) {
  try {
    var res = await fetch(url, { method: "HEAD" });
    return res.ok ? res : null;
  } catch (e) {
    return null;
  }
}

async function discoverParts(url) {
  var parts = [];
  for (var i = 1; i &lt;= MAX_PARTS; i++) {
    var partUrl = url + ".part" + i;
    var res = await headOk(partUrl);
    if (!res) break;
    var len = parseInt(res.headers.get("content-length") || "0", 10);
    parts.push({ url: partUrl, size: isNaN(len) ? 0 : len });
  }
  return parts;
}

async function fetchPart(url, onBytes) {
  var res = await fetch(url);
  if (!res.ok) throw new Error("Failed to fetch " + url + " (HTTP " + res.status + ")");
  var part = await res.blob();
  onBytes(part.size);
  return part;
}

var objectUrls = [];

function basename(url) {
  return url.split("/").pop();
}

async function fetchAsScriptBlob(url) {
  statusText.textContent = basename(url);
  var res = await fetch(url);
  if (!res.ok) throw new Error("Failed to fetch " + url + " (HTTP " + res.status + ")");
  var text = await res.text();
  var blob = new Blob([text], { type: "text/javascript" });
  var objUrl = URL.createObjectURL(blob);
  objectUrls.push(objUrl);
  return objUrl;
}

async function resolveUrl(url, mimeType, plan, onBytes, onFile) {
  var parts = plan[url];
  if (!parts || !parts.length) return url;
  var pieces = [];
  for (var i = 0; i &lt; parts.length; i++) {
    onFile(basename(parts[i].url));
    pieces.push(await fetchPart(parts[i].url, onBytes));
  }
  var blob = new Blob(pieces, { type: mimeType });
  pieces.length = 0;
  var objUrl = URL.createObjectURL(blob);
  objectUrls.push(objUrl);
  return objUrl;
}

  var totalBytes = 0;
  Object.keys(plan).forEach(function (k) {
    plan[k].forEach(function (p) { totalBytes += p.size; });
  });

  var loadedBytes = 0;
  var currentFile = "";
  function onBytes(n) {
    loadedBytes += n;
    if (totalBytes &gt; 0) {
      var frac = Math.min(loadedBytes / totalBytes, 1);
      progressBarFull.style.width = (frac * 90) + "%";
      statusText.textContent = currentFile + " — " + Math.round(frac * 100) + "%";

  function onFile(name) {

    statusText.textContent = currentFile;
  }

  var resolvedData = await resolveUrl(dataUrl, "application/octet-stream", plan, onBytes, onFile);
  var resolvedWasm = await resolveUrl(wasmUrl, "application/wasm", plan, onBytes, onFile);

  var resolvedLoader = await fetchAsScriptBlob(loaderUrl);
  var resolvedFramework = await fetchAsScriptBlob(buildUrl + "/ClusterTruckWEB.framework.js");

  statusText.textContent = "Starting...";

  var height = box.height || window.innerHeight || 540;
  var scale = Math.min(1, maxWidth / width, maxHeight / height);

  canvas.height = Math.max(1, Math.round(height * scale));

      function checkWrites() {

          resolve(false);
        } else {

        }

      setTimeout(checkWrites, 0);
    });
  };

  loadingBar.style.display = "none";

  objectUrls.forEach(function (u) { URL.revokeObjectURL(u); });
  objectUrls = [];

  window.addEventListener("keydown", function (e) {
    if (e.key === "F" || e.key === "f") {

      }
    }

}

function startClustertruck() {
  if (started) return;

    showError("&lt;b&gt;Failed to start.&lt;/b&gt;&lt;br&gt;" + (err &amp;&amp; err.message ? err.message : err));

}

  document.getElementById('mobile-start-button').onclick = startClustertruck;
} else {
